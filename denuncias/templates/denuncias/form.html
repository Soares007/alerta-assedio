{% extends 'base.html' %}

{% block content %}
<h2>Registrar nova denúncia</h2>

<p>Preencha as informações abaixo com atenção.
    Caso prefira, marque a opção de denúncia anônima.
</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Enviar denúncia</button>
</form>

{% endblock %}
