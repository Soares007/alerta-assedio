{% extends 'base.html' %}

{% block content %}

<style>
    .minhas-header {
        margin-bottom: 24px;
    }

    .minhas-header h2 {
        color: #111827;
        margin-bottom: 8px;
    }

    .minhas-header p {
        color: #6b7280;
        line-height: 1.5;
    }

    .denuncias-lista {
        display: grid;
        gap: 18px;
    }

    .denuncia-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.04);
        border-left: 5px solid #2563eb;
    }

    .denuncia-topo {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 18px;
    }

    .denuncia-topo h3 {
        color: #111827;
        margin-bottom: 10px;
    }

    .denuncia-data {
        color: #6b7280;
        font-size: 13px;
        text-align: right;
        white-space: nowrap;
    }

    .badge-status,
    .badge-anonima,
    .badge-identificada,
    .badge-gravidade,
    .badge-urgente {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        margin-right: 6px;
        margin-top: 6px;
    }

    .badge-status {
        background: #eff6ff;
        color: #1d4ed8;
    }

    .badge-anonima {
        background: #fee2e2;
        color: #991b1b;
    }

    .badge-identificada {
        background: #dcfce7;
        color: #166534;
    }

    .gravidade-baixa {
        background: #dcfce7;
        color: #166534;
    }

    .gravidade-media {
        background: #fef9c3;
        color: #854d0e;
    }

    .gravidade-alta {
        background: #ffedd5;
        color: #9a3412;
    }

    .gravidade-critica {
        background: #fee2e2;
        color: #991b1b;
    }

    .badge-urgente {
        background: #dc2626;
        color: white;
    }

    .denuncia-info {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 18px;
    }

    .info-mini {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 12px;
    }

    .info-mini span {
        display: block;
        color: #6b7280;
        font-size: 12px;
        margin-bottom: 4px;
    }

    .info-mini strong {
        color: #111827;
        font-size: 14px;
    }

    .descricao-box {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 14px;
        color: #374151;
        line-height: 1.6;
        margin-bottom: 16px;
    }

    .resposta-box {
        background: #ecfdf5;
        border: 1px solid #bbf7d0;
        color: #166534;
        border-radius: 12px;
        padding: 14px;
        line-height: 1.6;
        margin-top: 8px;
    }

    .sem-resposta {
        background: #fefce8;
        border: 1px solid #fde68a;
        color: #854d0e;
        border-radius: 12px;
        padding: 14px;
        margin-top: 8px;
    }

    .empty-minhas {
        background: #f9fafb;
        border: 1px dashed #d1d5db;
        color: #6b7280;
        padding: 35px;
        border-radius: 16px;
        text-align: center;
    }

    @media (max-width: 900px) {
        .denuncia-topo {
            flex-direction: column;
        }

        .denuncia-data {
            text-align: left;
            white-space: normal;
        }

        .denuncia-info {
            grid-template-columns: 1fr;
        }
    }

    .filtros-minhas {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr auto;
    gap: 12px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.limpar-minhas {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    background: #f3f4f6;
    color: #374151;
    border-radius: 10px;
    font-weight: 600;
    padding: 12px;
    transition: 0.2s;
}

.limpar-minhas:hover {
    background: #e5e7eb;
}

.paginacao-minhas {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-top: 26px;
}

.paginacao-minhas button {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    font-weight: 600;
}

.paginacao-minhas button:hover {
    background: #1d4ed8;
}

.paginacao-minhas span {
    color: #374151;
    font-weight: 600;
}

@media (max-width: 1000px) {
    .filtros-minhas {
        grid-template-columns: 1fr;
    }
}

.btn-detalhes {
    margin-top: 14px;
    background: #111827;
    color: white;
    padding: 10px 14px;
    border-radius: 10px;
    font-weight: 600;
}

.detalhes-extra {
    display: none;
    margin-top: 18px;
    border-top: 1px solid #e5e7eb;
    padding-top: 18px;
}

.detalhes-extra.active {
    display: block;
}

.anexo-preview {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 14px;
    margin-top: 12px;
}

.anexo-preview img,
.anexo-preview video {
    width: 100%;
    max-height: 360px;
    object-fit: contain;
    border-radius: 12px;
    background: #111827;
}

.anexo-preview iframe {
    width: 100%;
    height: 420px;
    border: none;
    border-radius: 12px;
}

.link-preview {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 14px;
    word-break: break-all;
}
</style>

<div class="minhas-header">
    <h2>Minhas denúncias</h2>
    <p>
        Acompanhe suas denúncias registradas, veja o status atual e confira as respostas enviadas pelo RH.
    </p>
</div>

<form id="filtrosMinhas" class="filtros-minhas">

    <input
        type="text"
        name="busca"
        placeholder="Pesquisar na descrição..."
        value="{{ busca }}"
    >

    <select name="status">
        <option value="">Todos os status</option>
        <option value="recebida" {% if status_filtro == 'recebida' %}selected{% endif %}>Recebida</option>
        <option value="analise" {% if status_filtro == 'analise' %}selected{% endif %}>Em análise</option>
        <option value="resolvida" {% if status_filtro == 'resolvida' %}selected{% endif %}>Resolvida</option>
    </select>

    <select name="tipo">
        <option value="">Todos os tipos</option>
        <option value="moral" {% if tipo_filtro == 'moral' %}selected{% endif %}>Assédio moral</option>
        <option value="sexual" {% if tipo_filtro == 'sexual' %}selected{% endif %}>Assédio sexual</option>
        <option value="abuso" {% if tipo_filtro == 'abuso' %}selected{% endif %}>Abuso de poder</option>
        <option value="discriminacao" {% if tipo_filtro == 'discriminacao' %}selected{% endif %}>Discriminação</option>
        <option value="ameaca" {% if tipo_filtro == 'ameaca' %}selected{% endif %}>Ameaça</option>
        <option value="violencia" {% if tipo_filtro == 'violencia' %}selected{% endif %}>Violência</option>
        <option value="outros" {% if tipo_filtro == 'outros' %}selected{% endif %}>Outros</option>
    </select>

    <a href="/minhas-denuncias/" class="limpar-minhas">
        Limpar filtros
    </a>

</form>

<div id="listaMinhasDenuncias">
    {% include 'denuncias/partials/lista_minhas_denuncias.html' %}
</div>

<script>
    const formMinhas = document.getElementById('filtrosMinhas');
    const listaMinhas = document.getElementById('listaMinhasDenuncias');

    let timeoutMinhas;

    window.carregarMinhasDenuncias = function(page = 1) {
        const formData = new FormData(formMinhas);
        const params = new URLSearchParams(formData);

        params.set('page', page);

        fetch(`/minhas-denuncias/?${params.toString()}`, {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json())
        .then(data => {
            listaMinhas.innerHTML = data.html;
            window.iniciarSlidersLista();
        });
    };

    window.toggleDetalhes = function(botao) {
        const detalhes = botao.nextElementSibling;

        if (!detalhes) return;

        detalhes.classList.toggle('active');

        botao.innerText = detalhes.classList.contains('active')
            ? 'Ocultar detalhes'
            : 'Exibir mais detalhes';

        window.iniciarSlidersLista();
    };

    window.iniciarSlidersLista = function() {
        document.querySelectorAll('.creative-anexos').forEach(slider => {
            slider.dataset.indice = slider.dataset.indice || '0';
            slider.dataset.filtro = slider.dataset.filtro || 'todos';

            const slides = slider.querySelectorAll('.creative-slide');

            slides.forEach(slide => slide.classList.remove('active'));

            if (slides.length > 0) {
                slides[0].classList.add('active');
            }
        });
    };

    window.getSlidesVisiveis = function(slider) {
        const filtro = slider.dataset.filtro || 'todos';
        const slides = Array.from(slider.querySelectorAll('.creative-slide'));

        return slides.filter(slide => {
            return filtro === 'todos' || slide.dataset.tipo === filtro;
        });
    };

    window.mostrarSlideLista = function(slider, index) {

    const todosSlides = slider.querySelectorAll(
        '.creative-slide'
    );

    const visiveis = window.getSlidesVisiveis(
        slider
    );

    const estadoVazio = slider.querySelector(
        '.empty-slider-state'
    );

    todosSlides.forEach(slide => {
        slide.classList.remove('active');
    });

    if (visiveis.length === 0) {

        slider.dataset.indice = '0';

        if (estadoVazio) {
            estadoVazio.classList.add('active');
        }

        return;
    }

    if (estadoVazio) {
        estadoVazio.classList.remove('active');
    }

    if (index < 0) {
        index = visiveis.length - 1;
    }

    if (index >= visiveis.length) {
        index = 0;
    }

    slider.dataset.indice = index;

    visiveis[index].classList.add('active');

};

    window.mudarAnexoLista = function(botao, direcao) {
        const slider = botao.closest('.creative-anexos');
        const indiceAtual = parseInt(slider.dataset.indice || '0');

        window.mostrarSlideLista(slider, indiceAtual + direcao);
    };

    window.filtrarAnexosLista = function(botao, tipo) {
        const slider = botao.closest('.creative-anexos');

        slider.dataset.filtro = tipo;
        slider.dataset.indice = '0';

        slider.querySelectorAll('.tab-anexo').forEach(tab => {
            tab.classList.remove('active');
        });

        botao.classList.add('active');

        window.mostrarSlideLista(slider, 0);
    };

    if (formMinhas) {
        const busca = formMinhas.querySelector('input[name="busca"]');
        const selects = formMinhas.querySelectorAll('select');

        if (busca) {
            busca.addEventListener('input', () => {
                clearTimeout(timeoutMinhas);

                timeoutMinhas = setTimeout(() => {
                    window.carregarMinhasDenuncias(1);
                }, 500);
            });
        }

        selects.forEach(select => {
            select.addEventListener('change', () => {
                window.carregarMinhasDenuncias(1);
            });
        });
    }

    window.iniciarSlidersLista();
</script>
{% endblock %}
