{% extends 'base.html' %}

{% block content %}

<h2>Recuperar senha</h2>

<p>Informe seu e-mail para receber um link de redefinição de senha.</p>

<form method="post">
    {% csrf_token %}

    {{ form.email.label_tag }}
    {{ form.email }}

    <button type="submit">
        Enviar link
    </button>
</form>

{% endblock %}
