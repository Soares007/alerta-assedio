<!DOCTYPE html>
<html>
<body style="margin:0;background:#f3f4f6;padding:30px;font-family:Arial,sans-serif;">

<div style="max-width:650px;margin:auto;background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08);">

    <div style="background:#111827;padding:24px;">
        <h1 style="color:white;margin:0;font-size:22px;">
            Sistema de Denúncias
        </h1>
    </div>

    <div style="padding:32px;">
        <h2 style="color:#111827;margin-top:0;">
            Redefinição de senha
        </h2>

        <p style="color:#4b5563;line-height:1.7;">
            Recebemos uma solicitação para redefinir a senha da sua conta.
        </p>

        <p style="color:#4b5563;line-height:1.7;">
            Clique no botão abaixo para criar uma nova senha.
        </p>

        <div style="text-align:center;margin:30px 0;">
            <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
               style="background:#2563eb;color:white;padding:14px 24px;border-radius:12px;text-decoration:none;font-weight:700;display:inline-block;">
                Criar nova senha
            </a>
        </div>

        <p style="color:#6b7280;font-size:14px;line-height:1.6;">
            Este link expira em 30 minutos. Se você não solicitou esta alteração, ignore este e-mail.
        </p>
    </div>

</div>

</body>
</html>
