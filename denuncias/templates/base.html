<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Sistema de Denúncias</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
        }

        aside {
            width: 250px;
            background: #111827;
            min-height: 100vh;
            padding: 20px;
        }

        aside h2 {
            color: white;
            margin-bottom: 30px;
        }

        aside a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        aside a:hover {
            background: #1f2937;
            color: white;
        }

        main {
            flex: 1;
            padding: 40px;
        }

        .topbar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-top: 8px;
            margin-bottom: 20px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .logout-btn {
            background: #dc2626;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }

    </style>

</head>
<body>

<aside>

    <h2>Denúncias</h2>

    <a href="/dashboard/">Dashboard</a>

    <a href="/denuncia/">Nova denúncia</a>
    
    <a href="/todas-denuncias/">Todas as denúncias</a>

    <a href="/minhas-denuncias/">Minhas denúncias</a>

</aside>

<main>

    <div class="topbar">

        <div>
            <h2>Painel do Sistema</h2>
        </div>

        <div>

            {% if user.is_authenticated %}

                <span>
                    Olá, {{ user.username }}
                </span>

                <form method="post" action="/logout/" style="display:inline;">
                    {% csrf_token %}

                    <button class="logout-btn" type="submit">
                        Sair
                    </button>

                </form>

            {% endif %}

        </div>

    </div>

    <div class="card">

        {% block content %}
        {% endblock %}

    </div>

</main>

</body>
</html>
